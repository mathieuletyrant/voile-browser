[workspace]
resolver = "2"
members = ["crates/voile-core", "crates/voile-live", "crates/voile-app", "crates/voile-bundle"]

[workspace.package]
version = "1.1.0" # x-release-please-version
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
voile-core = { path = "crates/voile-core" }
voile-live = { path = "crates/voile-live" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
directories = "6"
url = "2"

# CEF via tauri-apps/cef-rs. Keep the major in sync with the CEF binaries you export.
cef = { version = "156.7", default-features = false }
